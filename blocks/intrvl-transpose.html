<script>
(function () {
  var T = IVT, $ = function (id) { return document.getElementById(id); }, esc = IntrvlCore.esc;

  // steps/semis = how far the instrument SOUNDS below what is written (negative = sounds higher)
  var KEYS = [
    { id: 'C',  label: 'C',  steps: 0, semis: 0, desc: 'sounds exactly as written' },
    { id: 'Bb', label: 'B♭', steps: 1, semis: 2, desc: 'sounds a major 2nd lower than written' },
    { id: 'Eb', label: 'E♭', steps: 5, semis: 9, desc: 'sounds a major 6th lower than written' },
    { id: 'F',  label: 'F',  steps: 4, semis: 7, desc: 'sounds a perfect 5th lower than written' },
    { id: 'A',  label: 'A',  steps: 2, semis: 3, desc: 'sounds a minor 3rd lower than written' }
  ];
  var INSTS = [
    { n: 'Concert pitch / C instruments (flute, oboe, violin, piano…)', steps: 0, semis: 0, desc: 'sounds exactly as written' },
    { n: 'Clarinet in B♭', steps: 1, semis: 2, desc: 'sounds a major 2nd lower than written' },
    { n: 'Trumpet / cornet / flugelhorn in B♭', steps: 1, semis: 2, desc: 'sounds a major 2nd lower than written' },
    { n: 'Soprano saxophone (B♭)', steps: 1, semis: 2, desc: 'sounds a major 2nd lower than written' },
    { n: 'Tenor saxophone (B♭)', steps: 1, semis: 2, desc: 'sounds a major 9th lower than written (octave + major 2nd)' },
    { n: 'Bass clarinet (B♭)', steps: 1, semis: 2, desc: 'sounds a major 9th lower than written (octave + major 2nd)' },
    { n: 'Alto saxophone (E♭)', steps: 5, semis: 9, desc: 'sounds a major 6th lower than written' },
    { n: 'Baritone saxophone (E♭)', steps: 5, semis: 9, desc: 'sounds an octave + major 6th lower than written' },
    { n: 'French horn (F)', steps: 4, semis: 7, desc: 'sounds a perfect 5th lower than written' },
    { n: 'Cor anglais / English horn (F)', steps: 4, semis: 7, desc: 'sounds a perfect 5th lower than written' },
    { n: 'Clarinet in A', steps: 2, semis: 3, desc: 'sounds a minor 3rd lower than written' },
    { n: 'Alto flute (G)', steps: 3, semis: 5, desc: 'sounds a perfect 4th lower than written' },
    { n: 'E♭ clarinet', steps: -2, semis: -3, desc: 'sounds a minor 3rd HIGHER than written' },
    { n: 'Trumpet in D', steps: -1, semis: -2, desc: 'sounds a major 2nd HIGHER than written' },
    { n: 'Piccolo', steps: 0, semis: 0, desc: 'sounds an octave higher than written (same note names)' },
    { n: 'Guitar', steps: 0, semis: 0, desc: 'sounds an octave lower than written (same note names)' },
    { n: 'Double bass', steps: 0, semis: 0, desc: 'sounds an octave lower than written (same note names)' }
  ];

  var st = { mode: 'key', l: 0, a: 0, from: 1, to: 2 };       // from/to index into KEYS (key mode) or INSTS (inst mode)
  function list() { return st.mode === 'key' ? KEYS : INSTS; }

  function toConcert(n, it) { return T.transpose(n, -it.steps, -it.semis); }
  function toWritten(n, it) { return T.transpose(n, it.steps, it.semis); }
  // Prefer a spelling with at most one accidental if the result needs a double sharp/flat.
  function simpler(n) {
    if (Math.abs(n.a) < 2) return null;
    var best = null;
    [-1, 1].forEach(function (d) {
      var l = (n.l + d + 7) % 7, diff = (((T.pc(n) - T.BASE_PC[l]) % 12) + 12) % 12; if (diff > 6) diff -= 12;
      if (Math.abs(diff) <= 1 && (!best || Math.abs(diff) < Math.abs(best.a))) best = T.N(l, diff);
    });
    return best;
  }
  function nm(n) { return T.name(n); }
  function keyLine(n, mode) {           // "B♭ major (2♭)" — switches to the enharmonic key if the signature would be silly
    var t = mode === 'major' ? n : n, c = T.fifths(t) - (mode === 'minor' ? 3 : 0), note = '';
    if (Math.abs(c) > 7) { var alt = simpler(t) || T.fromFifths(T.fifths(t) + (T.fifths(t) > 0 ? -12 : 12)); t = alt; c = T.fifths(t) - (mode === 'minor' ? 3 : 0); note = ' (enharmonic)'; }
    return nm(t) + ' ' + mode + ' · ' + T.sigText(c) + note;
  }

  function drawSelectors() {
    $('tr-letters').innerHTML = T.LETTERS.map(function (L, i) { return '<button data-l="' + i + '"' + (i === st.l ? ' class="on"' : '') + '>' + L + '</button>'; }).join('');
    Array.prototype.forEach.call($('tr-acc').children, function (b) { b.classList.toggle('on', Number(b.getAttribute('data-a')) === st.a); });

    function sel(id, cur) {
      return '<select class="iv-select" id="' + id + '">' + items.map(function (k, i) { return '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + (st.mode === 'key' ? 'in ' + k.label : k.n) + '</option>'; }).join('') + '</select>';

    $('tr-to').innerHTML = sel('tr-tosel', st.to);
    $('tr-fromsel').onchange = function () { st.from = Number(this.value); drawOut(); };
    $('tr-tosel').onchange = function () { st.to = Number(this.value); drawOut(); };
    $('tr-help').textContent = st.mode === 'key'
      ? 'Type a note as written for one transposing key and see what to write for another. “In C” means concert pitch.'

    $('tr-fromlabel').textContent = st.mode === 'key' ? 'Note is written in…' : 'Written for…';
    $('tr-tolabel').textContent = st.mode === 'key' ? 'Write it in…' : 'Write it for…';

    var items = list(), A = items[st.from], B = items[st.to], note = T.N(st.l, st.a);

    var sA = simpler(concert), sR = simpler(result);

      '<div class="tr-n"><small>Written</small><b>' + nm(note) + '</b></div><div class="tr-arrow">→</div>' +
      '<div class="tr-n"><small>Concert</small><b>' + nm(concert) + '</b></div><div class="tr-arrow">→</div>' +
      '<div class="tr-n res"><small>Write</small><b>' + nm(result) + '</b></div></div>';
    if (sR) h += '<p class="iv-note iv-center">' + nm(result) + ' is awkward — the same pitch is usually written <b>' + nm(sR) + '</b>.</p>';
    if (sA && !sR) h += '<p class="iv-note iv-center">(Concert ' + nm(concert) + ' is also spelled ' + nm(sA) + '.)</p>';

    h += '<p style="margin-top:.8rem">A written <b>' + nm(note) + '</b> on <b>' + esc(title(A)) + '</b> ' + esc(A.desc) + ' — that’s concert <b>' + nm(concert) + '</b>. To make the same sound on <b>' + esc(title(B)) + '</b>, write <b>' + nm(result) + '</b>' + (B.desc.indexOf('octave') !== -1 ? ' (' + esc(B.desc) + ')' : '') + '.</p>';

    var keyRes = (A === B) ? '' :
      '<div class="iv-label" style="margin-top:1rem">If it’s a key (the note is the tonic)</div>' +
      '<p>' + keyLine(note, 'major') + ' &nbsp;→&nbsp; <b>' + keyLine(result, 'major') + '</b></p>' +
      '<p style="margin-top:.2rem">' + keyLine(note, 'minor') + ' &nbsp;→&nbsp; <b>' + keyLine(result, 'minor') + '</b></p>';
    h += keyRes;

    h += '<div class="iv-row" style="margin-top:.9rem"><button class="iv-btn small ghost" id="tr-hear">▶ Hear concert ' + nm(concert) + '</button></div>';

    h += '<div class="iv-label" style="margin-top:1.1rem">Same sound, every key</div><table class="tr-table">' +
      KEYS.map(function (k) {
        var w = toWritten(concert, k), hl = (st.mode === 'key' && (k === A || k === B)) ? ' class="hl"' : '';
        return '<tr' + hl + '><td>' + (k.id === 'C' ? 'Concert pitch (C)' : 'Written for ' + k.label + ' instruments') + '</td><td>' + nm(w) + '</td></tr>';
      }).join('') + '</table>';
    $('tr-out').innerHTML = h;
    $('tr-hear').onclick = function () { var p = T.pc(concert); T.play(60 + (p > 6 ? p - 12 : p), { dur: 1.8 }); };
  }

  $('tr-mode').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.mode = b.getAttribute('data-m');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    st.from = st.mode === 'key' ? 1 : 1; st.to = st.mode === 'key' ? 2 : 6;
    drawSelectors(); drawOut();
  };
  $('tr-letters').onclick = function (e) { var b = e.target.closest('button'); if (b) { st.l = Number(b.getAttribute('data-l')); drawSelectors(); drawOut(); } };
  $('tr-acc').onclick = function (e) { var b = e.target.closest('button'); if (b) { st.a = Number(b.getAttribute('data-a')); drawSelectors(); drawOut(); } };
  $('tr-swap').onclick = function () { var x = st.from; st.from = st.to; st.to = x; drawSelectors(); drawOut(); };
  drawSelectors(); drawOut();
