<!--@shared-css-->

<style>
  #ks-streak-count { color: var(--intrvl-accent-dark); }
  #ks-accuracy-count { color: var(--intrvl-active-dark); }
  #intrvl-app .csb-options-grid .choice-btn { font-family: var(--intrvl-font-body); font-size: 1.15rem; }
  #ks-target-container {
    background: var(--intrvl-panel-bg);
    border: 2px solid var(--intrvl-border);
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 1.4rem auto;
    padding: 10px 14px;
    box-sizing: border-box;
    box-shadow: inset 0 4px 15px rgba(0,0,0,0.02);
  }
</style>

<canvas aria-hidden="true" id="confetti-canvas-ks" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; opacity:0; transition:opacity 1s ease;"></canvas>

<div id="intrvl-app">

  <div class="intrvl-header-v2">
    <div class="stats-wrapper">
      <div class="stat-box">
        <span class="stat-label">Streak</span>
        <div class="stat-display"><span aria-hidden="true">🔥</span> <span id="ks-streak-count">0</span></div>
      </div>
      <div class="stat-box">
        <span class="stat-label">Accuracy</span>
        <div class="stat-display"><span aria-hidden="true">🎯</span> <span id="ks-accuracy-count">0%</span></div>
      </div>
    </div>
  </div>

  <div id="intrvl-game-area">

    <div id="screen-start" class="button-stack">
      <p id="ks-intro" style="color: var(--intrvl-ink-soft); line-height: 1.5; margin-bottom: 2rem;">
        30 seconds. Name the major or minor key from its signature.<br>Build your combo for massive points.
      </p>
      <button class="btn-primary" onclick="startKsSprint(true)">Start Daily Sprint</button>
      <button class="btn-practice" onclick="startKsSprint(false)">Practice Sprint</button>
    </div>

    <div id="screen-game" class="hidden" style="width: 100%;">
      <div class="game-hud">
        <div>Score: <span id="ui-score" class="score-highlight">0</span></div>
        <div id="ui-combo" class="combo-badge" aria-hidden="true">🔥 x2 COMBO</div>
        <div><span id="ui-timer" class="timer-highlight">30</span>s</div>
      </div>

      <p class="instruction-text" id="ks-question" aria-live="polite">Which key has this signature?</p>

      <div id="ks-target-container"></div>

      <div class="csb-options-grid" id="ks-buttons-container">
        <button class="choice-btn" id="btn-ks-0" onclick="submitKsGuess(0)">Opt 1</button>
        <button class="choice-btn" id="btn-ks-1" onclick="submitKsGuess(1)">Opt 2</button>
        <button class="choice-btn" id="btn-ks-2" onclick="submitKsGuess(2)">Opt 3</button>
        <button class="choice-btn" id="btn-ks-3" onclick="submitKsGuess(3)">Opt 4</button>
      </div>
    </div>

    <div id="screen-done" class="hidden button-stack">
      <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;" id="end-title">Time's Up!</h2>
      <p style="font-size: 1.4rem; font-family: var(--intrvl-font-head); font-weight: 900; color: var(--intrvl-accent-dark); margin-bottom: 0.5rem;" id="end-score">Score: 0</p>
      <p style="color: var(--intrvl-ink-soft); font-size: 0.9rem; margin-bottom: 2rem;" id="end-high-score">Personal High: 0</p>

      <button class="btn-share hidden" id="btn-share" onclick="shareKsResults()">Share Results 🚀</button>
      <button class="btn-primary hidden" id="btn-try-again" onclick="resetKsToStart()">Back to Menu</button>
    </div>

  </div>

</div>

<script>
  window.INTRVL_CONFIG = {
    startFn: 'startKsSprint',
    kind: 'game', id: 'keysig', gameId: 'keysig',
    easy: false, title: 'Key Signature Sprint',
    accentColors: ['#D9A074', '#A9B9A2', '#C1A45F', '#B7A7C9']
  };
</script>
<!--@notation-js-->
<!--@shared-js-->
<script>
  const PAGE_CFG = window.INTRVL_CONFIG;
  const GAME_ID = PAGE_CFG.gameId;                 // 'keysig' or 'keysig-easy'
  const EASY = !!PAGE_CFG.easy;
  const TITLE = PAGE_CFG.title;

  // Key names by number of sharps (+) / flats (-) in the signature
  const MAJOR_NAMES = { '-7': 'C♭', '-6': 'G♭', '-5': 'D♭', '-4': 'A♭', '-3': 'E♭', '-2': 'B♭', '-1': 'F', '0': 'C', '1': 'G', '2': 'D', '3': 'A', '4': 'E', '5': 'B', '6': 'F♯', '7': 'C♯' };
  const MINOR_NAMES = { '-7': 'A♭', '-6': 'E♭', '-5': 'B♭', '-4': 'F', '-3': 'C', '-2': 'G', '-1': 'D', '0': 'A', '1': 'E', '2': 'B', '3': 'F♯', '4': 'C♯', '5': 'G♯', '6': 'D♯', '7': 'A♯' };
  function keyName(count, mode) { return (mode === 'major' ? MAJOR_NAMES : MINOR_NAMES)[count] + (mode === 'major' ? ' major' : ' minor'); }

  // How hard each round is:  daily = the full set for this version, practice = a gentler subset
  const LEVELS = EASY
    ? { daily: { max: 4, modes: ['major'], clefs: ['treble'] }, practice: { max: 2, modes: ['major'], clefs: ['treble'] } }
    : { daily: { max: 7, modes: ['major', 'minor'], clefs: ['treble', 'bass'] }, practice: { max: 4, modes: ['major', 'minor'], clefs: ['treble', 'bass'] } };

  let ksPool = [];
  let ksCurrentQ = null;
  let ksScore = 0;
  let ksCombo = 0;
  let ksMaxCombo = 0;
  let ksTimerInterval;
  let ksEndTime;
  let ksIsDailyMode = true;
  let ksIsGameActive = false;
  let currentLevel = 0;
  let ksStats;

  function initKsApp() {
    ksStats = IntrvlCore.loadStats();
    if (!ksStats.highScoreDaily) ksStats.highScoreDaily = 0;
    if (!ksStats.highScorePractice) ksStats.highScorePractice = 0;
    if (EASY) document.getElementById('ks-intro').innerHTML = '30 seconds. Major keys with up to 4 sharps or flats.<br>Build your combo for massive points.';
    updateKsUIStats();
    if (ksStats.lastPlayedDate === IntrvlCore.todayStr()) showKsEndScreen(true, ksStats.highScoreDaily);
  }

  function updateKsUIStats() {
    document.getElementById('ks-streak-count').textContent = ksStats.currentStreak;
    const accuracy = ksStats.totalPlayed > 0 ? Math.round((ksStats.totalCorrect / ksStats.totalPlayed) * 100) : 0;
    document.getElementById('ks-accuracy-count').textContent = accuracy + '%';
  }

  // Every key allowed in this round, as { count, mode, name }
  function allowedKeys(level) {
    const keys = [];
    for (let c = -level.max; c <= level.max; c++) level.modes.forEach(mode => keys.push({ count: c, mode: mode, name: keyName(c, mode) }));
    return keys;
  }

  // Wrong answers that a real student might pick: the neighbouring keys round the circle of fifths.
  // In the normal version the question says MAJOR or MINOR, so every option is in that same mode.
  function distractorsFor(target, level, randomFunc) {
    if (!EASY) {
      const near = [1, -1, 2, -2, 3, -3, 4, -4].map(d => target.count + d).filter(c => Math.abs(c) <= level.max).map(c => keyName(c, target.mode));
      const rest = allowedKeys(level).filter(k => k.mode === target.mode && k.name !== target.name && near.indexOf(k.name) === -1).map(k => k.name);
      const pool = near.slice(0, 6).concat(rest).slice(0, 6), picked = [];
      while (picked.length < 3 && pool.length) picked.push(pool.splice(Math.floor(randomFunc() * pool.length), 1)[0]);
      return picked;
    }
    const other = target.mode === 'major' ? 'minor' : 'major';
    const wanted = [
      { count: target.count, mode: other },
      { count: target.count + 1, mode: target.mode }, { count: target.count - 1, mode: target.mode },
      { count: target.count + 2, mode: target.mode }, { count: target.count - 2, mode: target.mode },
      { count: target.count + 1, mode: other }, { count: target.count - 1, mode: other }
    ];
    const ok = wanted.filter(k => Math.abs(k.count) <= level.max && level.modes.includes(k.mode));
    const seen = new Set([target.name]), out = [];
    ok.forEach(k => { const name = keyName(k.count, k.mode); if (!seen.has(name)) { seen.add(name); out.push(name); } });
    // not enough close neighbours (tiny easy range): top up from anything allowed
    allowedKeys(level).forEach(k => { if (out.length < 6 && !seen.has(k.name)) { seen.add(k.name); out.push(k.name); } });
    const picked = [];
    const pool = out.slice(0, 6);
    while (picked.length < 3 && pool.length) picked.push(pool.splice(Math.floor(randomFunc() * pool.length), 1)[0]);
    return picked;
  }

  function generateKsPool(useSeed) {
    const randomFunc = useSeed ? IntrvlCore.mulberry32(IntrvlCore.getDailySeed()) : () => Math.random();
    const level = useSeed ? LEVELS.daily : LEVELS.practice;
    const keys = allowedKeys(level);
    const focus = IntrvlCore.takeFocus(GAME_ID);   // topics to lean towards in "practise my weak spots"
    const focusKeys = useSeed ? [] : keys.filter(k => focus.indexOf(k.name) !== -1);
    const pool = [];

    for (let i = 0; i < 200; i++) {
      const target = (focusKeys.length && randomFunc() < 0.7) ? focusKeys[Math.floor(randomFunc() * focusKeys.length)] : keys[Math.floor(randomFunc() * keys.length)];
      const clef = level.clefs[Math.floor(randomFunc() * level.clefs.length)];
      const options = [target.name].concat(distractorsFor(target, level, randomFunc));
      for (let j = options.length - 1; j > 0; j--) {
        const k = Math.floor(randomFunc() * (j + 1));
        [options[j], options[k]] = [options[k], options[j]];
      }
      pool.push({ count: target.count, mode: target.mode, clef: clef, correct: target.name, options: options, label: target.name });
    }
    return pool;
  }

  function startKsSprint(daily) {
    ksIsDailyMode = daily;
    ksScore = 0;
    ksCombo = 0;
    ksMaxCombo = 0;
    ksIsGameActive = true;

    ksPool = generateKsPool(ksIsDailyMode);
    currentLevel = 0;

    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');

    updateKsHUD();

    ksEndTime = Date.now() + 30000;
    ksTimerInterval = setInterval(ksTick, 100);

    nextKsQuestion();
  }

  function ksTick() {
    const remaining = Math.max(0, ksEndTime - Date.now());
    document.getElementById('ui-timer').textContent = Math.ceil(remaining / 1000);
    if (remaining <= 0) {
      clearInterval(ksTimerInterval);
      endKsSprint();
    }
  }

  function updateKsHUD() {
    document.getElementById('ui-score').textContent = ksScore;
    const badge = document.getElementById('ui-combo');
    if (ksCombo >= 3) {
      badge.textContent = `🔥 x${1 + Math.floor(ksCombo / 3)} COMBO`;
      badge.classList.add('active');
    } else {
      badge.classList.remove('active');
    }
  }

  function nextKsQuestion() {
    if (!ksIsGameActive) return;
    ksCurrentQ = ksPool[currentLevel];
    currentLevel++;

    document.getElementById('ks-target-container').innerHTML = IVN.keySigSvg(ksCurrentQ.clef, ksCurrentQ.count);
    if (!EASY) document.getElementById('ks-question').innerHTML = 'What <strong>' + ksCurrentQ.mode.toUpperCase() + '</strong> key is this?';

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn-ks-${i}`);
      btn.className = 'choice-btn';
      btn.disabled = false;
      btn.textContent = ksCurrentQ.options[i];
    }
    IntrvlCore.refocus('btn-ks-0');
  }

  function submitKsGuess(btnIndex) {
    if (!ksIsGameActive) return;
    for (let i = 0; i < 4; i++) document.getElementById(`btn-ks-${i}`).disabled = true;

    const btn = document.getElementById(`btn-ks-${btnIndex}`);
    const isCorrect = ksCurrentQ.options[btnIndex] === ksCurrentQ.correct;

    ksStats.totalPlayed++;
    IntrvlCore.recordItem(GAME_ID, ksCurrentQ.label, isCorrect);
    IntrvlCore.announce(isCorrect ? 'Correct' : 'Incorrect. The answer was ' + ksCurrentQ.correct);

    if (isCorrect) {
      ksStats.totalCorrect++;
      ksCombo++;
      if (ksCombo > ksMaxCombo) ksMaxCombo = ksCombo;
      ksScore += 2 * (1 + Math.floor(ksCombo / 3));
      btn.classList.add('correct');
    } else {
      ksCombo = 0;
      ksScore = Math.max(0, ksScore - 1);
      btn.classList.add('incorrect');
      document.getElementById(`btn-ks-${ksCurrentQ.options.indexOf(ksCurrentQ.correct)}`).classList.add('correct');
    }

    updateKsHUD();
    setTimeout(nextKsQuestion, 250);
  }

  function endKsSprint() {
    ksIsGameActive = false;
    document.getElementById('screen-game').classList.add('hidden');

    let isNewHigh = false;

    if (ksIsDailyMode) {
      if (ksStats.lastPlayedDate !== IntrvlCore.todayStr()) {
        ksStats.currentStreak++;
        ksStats.bestStreak = Math.max(ksStats.bestStreak, ksStats.currentStreak);
        ksStats.lastPlayedDate = IntrvlCore.todayStr();
        IntrvlCore.recordDailyResult(ksScore);
      }
      if (ksScore > ksStats.highScoreDaily) {
        ksStats.highScoreDaily = ksScore;
        ksStats.dailyBest = { date: IntrvlCore.dailySeedDate(), score: ksScore };
        isNewHigh = true;
      }
    } else if (ksScore > ksStats.highScorePractice) {
      ksStats.highScorePractice = ksScore;
      isNewHigh = true;
    }

    IntrvlCore.saveStats(ksStats);
    updateKsUIStats();

    if (isNewHigh) IntrvlCore.confetti('confetti-canvas-ks');

    IntrvlCore.announce('Time is up. You scored ' + ksScore + '.');
    showKsEndScreen(ksIsDailyMode, ksIsDailyMode ? ksStats.highScoreDaily : ksStats.highScorePractice, isNewHigh);
  }

  function addPracticeButton() {
    if (document.getElementById('ks-temp-prac')) return;
    const pracBtn = document.createElement('button');
    pracBtn.id = 'ks-temp-prac';
    pracBtn.className = 'btn-practice';
    pracBtn.textContent = 'Play Practice Sprint';
    pracBtn.onclick = () => { document.getElementById('ks-temp-prac').remove(); startKsSprint(false); };
    document.getElementById('screen-done').appendChild(pracBtn);
  }

  function showKsEndScreen(wasDaily, high, isNewHigh = false) {
    document.getElementById('screen-done').classList.remove('hidden');

    if (!ksIsGameActive && ksScore === 0 && wasDaily) {         // arrived back on the page after today's daily was done
      document.getElementById('end-title').textContent = 'Daily Complete!';
      document.getElementById('end-score').textContent = `Best Score: ${ksStats.highScoreDaily}`;
      document.getElementById('end-high-score').style.display = 'none';
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: GAME_ID, score: ksStats.highScoreDaily, streak: ksStats.currentStreak });
      addPracticeButton();
      return;
    }

    document.getElementById('end-title').textContent = isNewHigh ? 'New High Score! 🎉' : "Time's Up!";
    document.getElementById('end-score').textContent = `Score: ${ksScore}`;
    document.getElementById('end-high-score').style.display = 'block';
    document.getElementById('end-high-score').textContent = `Personal High: ${high}`;

    if (wasDaily) {
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: GAME_ID, score: ksScore, streak: ksStats.currentStreak });
      addPracticeButton();
    } else {
      document.getElementById('btn-share').classList.add('hidden');
      document.getElementById('btn-try-again').classList.remove('hidden');
    }
  }

  function resetKsToStart() {
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
    const tempPrac = document.getElementById('ks-temp-prac');
    if (tempPrac) tempPrac.remove();
  }

  function shareKsResults() {
    const accuracy = ksStats.totalPlayed > 0 ? Math.round((ksStats.totalCorrect / ksStats.totalPlayed) * 100) : 0;
    const pageUrl = window.location.href.split('?')[0];
    const textToShare = `I scored ${ksScore} on the Intrvl Daily ${TITLE}! 🔑\n\nMax Combo: 🔥 x${ksMaxCombo}\nStreak: ${ksStats.currentStreak} Days | Acc: ${accuracy}%\n\nCan you name keys faster than me?\n${pageUrl}`;
    IntrvlCore.share(textToShare, document.getElementById('btn-share'), 'Intrvl ' + TITLE);
  }

  initKsApp();
</script>
