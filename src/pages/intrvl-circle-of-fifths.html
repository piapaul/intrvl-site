<style>
  .cf-wheel { display: block; width: 100%; max-width: 360px; margin: 0 auto; }
  .cf-wheel path { cursor: pointer; transition: fill .15s; }
  .cf-wheel text { pointer-events: none; font-family: var(--intrvl-font-head); font-weight: 900; fill: var(--intrvl-ink); }
  .cf-wheel .alt { font-family: var(--intrvl-font-body); font-weight: 600; font-size: 7.5px; fill: var(--intrvl-ink-soft); }
  .cf-wheel .on-text { fill: var(--intrvl-ink); }
  .cf-wheel path:focus-visible { outline: 3px solid var(--intrvl-ink); outline-offset: -3px; }
  .cf-wheel .sig-big { font-size: 22px; }
  .cf-wheel .sig-small { font-family: var(--intrvl-font-body); font-size: 8px; font-weight: 600; fill: var(--intrvl-ink-soft); }
  .cf-title { font-family: var(--intrvl-font-head); font-weight: 900; font-size: 1.25rem; }
  .cf-staff { display: block; width: 100%; max-width: 300px; margin: .3rem auto 0; }
  .cf-staff text { font-family: var(--intrvl-font-body); }
  .cf-rel { display: flex; flex-wrap: wrap; gap: .4rem; }
</style>

<div id="intrvl-app">
  <p class="iv-note iv-center" style="margin-bottom:.4rem">Tap a key. Outer ring = major, inner ring = minor.</p>
  <svg class="cf-wheel" id="cf-wheel" viewBox="0 0 320 320" role="group" aria-label="Circle of fifths. Choose a key."></svg>

  <div class="iv-card" style="margin-top:1rem" id="cf-detail"></div>
</div>

      desc.slice().reverse().map(function (n, i) { return '<span class="iv-n' + (i === 6 ? ' root' : '') + '">' + T.name(n) + '<small>' + (7 - i) + '</small></span>'; }).join('') + '</div>';

    var V = T.fromFifths(s + 1), IV = T.fromFifths(s - 1);
    html += '<div class="iv-label" style="margin-top:1rem">Closest keys</div><div class="cf-rel">' +
      rel(s + 1, mode, 'V · ') + rel(s - 1, mode, 'IV · ') + rel(s, relMode, 'Relative · ') + '</div>';
    if (alt != null) html += '<div class="iv-note" style="margin-top:.8rem">Same sound, written differently: <button class="iv-linkbtn" id="cf-alt">' + keyName(alt, mode) + ' (' + T.sigText(alt) + ')</button></div>';
    $('cf-detail').innerHTML = html;

    $('cf-play').onclick = function () {
      var up = midis(scale); up.push(up[0] + 12);
      var dm = midis(desc || scale);                       // melodic minor comes down as natural minor
      var seq = up.concat(dm.slice(0, 7).reverse());       // 1 … 8, then 7 … 1
      seq.forEach(function (m, i) { setTimeout(function () { T.play(m, { dur: 0.7 }); }, i * 280); });
    };
    var mt = $('cf-mt'); if (mt) mt.onclick = function (e) { var b = e.target.closest('button'); if (b) { st.minorType = b.getAttribute('data-k'); drawDetail(); } };
    var al = $('cf-alt'); if (al) al.onclick = function () { st.s = alt; refresh(); };
    Array.prototype.forEach.call($('cf-detail').querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () { st.s = Number(b.getAttribute('data-s')); st.mode = b.getAttribute('data-mode'); refresh(); };
    });
  }
  function rel(s2, mode, prefix) {
    if (Math.abs(s2) > 7) s2 = altS(s2);
    return '<button class="iv-chip" data-go="1" data-s="' + s2 + '" data-mode="' + mode + '">' + prefix + keyName(s2, mode) + '</button>';
  }
  function fromMajor(s) { return T.fromFifths(s); }
  function midis(scale) {
    var base = 60 + (T.pc(scale[0]) > 6 ? T.pc(scale[0]) - 12 : T.pc(scale[0])), out = [], prev = base;
    scale.forEach(function (n, i) {
      if (i === 0) { out.push(base); return; }
      var m = prev + (((T.pc(n) - T.pc(scale[i - 1])) % 12 + 12) % 12 || 12);
      out.push(m); prev = m;
    });
    return out;
  }
  function refresh() { drawWheel(); drawDetail(); }

  $('cf-wheel').onkeydown = function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName.toLowerCase() === 'path') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  };
  $('cf-wheel').onclick = function (e) {
    var p = e.target.closest('path'); if (!p) return;
    var pos = Number(p.getAttribute('data-pos')), mode = p.getAttribute('data-mode');
    var d = defaultS(pos), a = (pos >= 5 && pos <= 7) ? altS(d) : null;
    if (st.mode === mode && posOf(st.s) === pos && a != null) st.s = (st.s === d ? a : d);   // tap again to flip the enharmonic spelling
    else st.s = d;
    st.mode = mode; refresh();
  };
  refresh();
})();
</script>
