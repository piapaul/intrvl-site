<!--@shared-css-->
<style>
  .tr-letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .tr-letters button { padding: .65rem 0; border-radius: 10px; border: 1px solid var(--intrvl-stone); background: var(--intrvl-panel-bg); font: 800 1.05rem var(--intrvl-font-body); cursor: pointer; }
  .tr-letters button.on { background: var(--intrvl-accent); border-color: var(--intrvl-accent-dark); }
  .tr-flow { display: flex; align-items: center; justify-content: center; gap: .6rem; margin: .2rem 0 .6rem; }
  .tr-n { text-align: center; }
  .tr-n b { display: block; font: 900 2.4rem/1.05 var(--intrvl-font-head); }
  .tr-n small { color: var(--intrvl-ink-soft); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .tr-arrow { font-size: 1.4rem; color: var(--intrvl-placeholder); }
  .tr-n.res b { color: var(--intrvl-accent-dark); font-size: 3rem; }
  .tr-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .tr-table td { padding: .42rem .3rem; border-bottom: 1px solid var(--intrvl-border); }
  .tr-table tr:last-child td { border-bottom: none; }
  .tr-table td:last-child { text-align: right; font: 900 1rem var(--intrvl-font-head); }
  .tr-table tr.hl td { background: color-mix(in srgb, var(--intrvl-accent) 30%, white); }
  .tr-swap { align-self: end; }
</style>

<div id="intrvl-app">
  <div class="iv-seg" id="tr-mode">
    <button data-m="key" class="on">By key</button>
    <button data-m="inst">Instrument to instrument</button>
  </div>
  <p class="iv-note" id="tr-help" style="margin:.5rem 0 1rem"></p>

  <div class="iv-label">The note</div>
  <div class="tr-letters" id="tr-letters"></div>
  <div class="iv-seg" id="tr-acc" style="margin-top:.5rem">
    <button data-a="-1">♭ flat</button><button data-a="0" class="on">♮ natural</button><button data-a="1">♯ sharp</button>
  </div>

  <div class="iv-row" style="margin-top:1rem;align-items:flex-end;flex-wrap:nowrap">
    <div class="iv-grow"><span class="iv-label" id="tr-fromlabel">Written for…</span><div id="tr-from"></div></div>
    <button class="iv-iconbtn tr-swap" id="tr-swap" aria-label="Swap">⇄</button>
    <div class="iv-grow"><span class="iv-label" id="tr-tolabel">Write it for…</span><div id="tr-to"></div></div>
  </div>

  <div class="iv-card" style="margin-top:1.1rem" id="tr-out"></div>
</div>

    h += '<div class="iv-row" style="margin-top:.9rem"><button class="iv-btn small ghost" id="tr-hear">▶ Hear concert ' + nm(concert) + '</button></div>';

    h += '<div class="iv-label" style="margin-top:1.1rem">Same sound, every key</div><table class="tr-table">' +
      KEYS.map(function (k) {
        var w = toWritten(concert, k), hl = (st.mode === 'key' && (k === A || k === B)) ? ' class="hl"' : '';
        return '<tr' + hl + '><td>' + (k.id === 'C' ? 'Concert pitch (C)' : 'Written for ' + k.label + ' instruments') + '</td><td>' + nm(w) + '</td></tr>';
      }).join('') + '</table>';
    $('tr-out').innerHTML = h;
    $('tr-hear').onclick = function () { var p = T.pc(concert); T.play(60 + (p > 6 ? p - 12 : p), { dur: 1.8 }); };
  }

  $('tr-mode').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.mode = b.getAttribute('data-m');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    st.from = st.mode === 'key' ? 1 : 1; st.to = st.mode === 'key' ? 2 : 6;
    drawSelectors(); drawOut();
  };
  $('tr-letters').onclick = function (e) { var b = e.target.closest('button'); if (b) { st.l = Number(b.getAttribute('data-l')); drawSelectors(); drawOut(); } };
  $('tr-acc').onclick = function (e) { var b = e.target.closest('button'); if (b) { st.a = Number(b.getAttribute('data-a')); drawSelectors(); drawOut(); } };
  $('tr-swap').onclick = function () { var x = st.from; st.from = st.to; st.to = x; drawSelectors(); drawOut(); };
  drawSelectors(); drawOut();
})();
</script>
