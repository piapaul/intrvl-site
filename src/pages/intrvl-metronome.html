<!--@shared-css-->
<style>
  .mt-pulses { display: flex; justify-content: center; gap: 10px; margin: .2rem 0 1.1rem; min-height: 28px; }
  .mt-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--intrvl-border); transition: background .05s, transform .05s; }
  .mt-dot.on { background: var(--intrvl-accent); transform: scale(1.25); }
  .mt-dot.accent.on { background: var(--intrvl-accent-dark); transform: scale(1.4); }
  .mt-dot.accent { outline: 2px solid var(--intrvl-stone); outline-offset: 2px; }
  .mt-tempo-name { font-family: var(--intrvl-font-head); font-style: italic; color: var(--intrvl-ink-soft); text-align: center; margin-top: .3rem; min-height: 1.4em; }
  .mt-steps { display: flex; align-items: center; gap: 8px; margin: .6rem 0 .3rem; }
  .mt-steps .iv-range { margin: 0; }
  #mt-toggle.running { background: var(--intrvl-error-fg); }
</style>

<div id="intrvl-app">
  <div class="iv-bigval" id="mt-bpm">100</div>
  <div class="iv-unit">beats per minute</div>
  <div class="mt-tempo-name" id="mt-name"></div>

  <div class="mt-steps">
    <button class="iv-iconbtn" id="mt-m10" aria-label="Minus 10">−10</button>
    <button class="iv-iconbtn" id="mt-m1" aria-label="Minus 1">−</button>
    <input type="range" class="iv-range" id="mt-slider" min="30" max="240" value="100" aria-label="Tempo">
    <button class="iv-iconbtn" id="mt-p1" aria-label="Plus 1">+</button>
    <button class="iv-iconbtn" id="mt-p10" aria-label="Plus 10">+10</button>
  </div>

  <div class="mt-pulses" id="mt-pulses"></div>

  <div class="iv-stack" style="gap:1rem">
    <div>
      <span class="iv-label">Beats per bar</span>
      <div class="iv-chips" id="mt-beats"></div>
    </div>
    <div>
      <span class="iv-label">Click subdivision</span>
      <div class="iv-seg" id="mt-sub">
        <button data-sub="1" class="on">Beats</button>
        <button data-sub="2">Eighths</button>
        <button data-sub="3">Triplets</button>
        <button data-sub="4">Sixteenths</button>
      </div>
    </div>
  </div>

  <div class="button-stack" style="margin-top:1.3rem">
    <button class="btn-start" id="mt-toggle">Start</button>
    <button class="btn-practice" id="mt-tap">Tap tempo</button>
  </div>
  <p class="iv-note iv-center" id="mt-hint" style="margin-top:.7rem;min-height:1.2em"></p>
</div>

<script>window.INTRVL_CONFIG = { kind: 'tool', id: 'metronome' };</script>
<!--@shared-js-->
<script>
(function () {
  var bpm = 100, beats = 4, sub = 1, playing = false, ctx = null, nextTime = 0, tick = 0, timer = null, taps = [];
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = [[40, 'Grave'], [60, 'Largo'], [66, 'Larghetto'], [76, 'Adagio'], [108, 'Andante'], [120, 'Moderato'], [156, 'Allegro'], [176, 'Vivace'], [200, 'Presto'], [999, 'Prestissimo']];

  function setBpm(v) {
    bpm = Math.max(30, Math.min(240, Math.round(v)));
    $('mt-bpm').textContent = bpm; $('mt-slider').value = bpm;
    var n = NAMES.filter(function (x) { return bpm < x[0]; })[0] || NAMES[NAMES.length - 1];
    $('mt-name').textContent = n[1];
  }
  function drawDots() {
    $('mt-pulses').innerHTML = Array.from({ length: beats }, function (_, i) { return '<div class="mt-dot' + (i === 0 ? ' accent' : '') + '"></div>'; }).join('');
  }
  function flash(beat, strong) {
    var d = $('mt-pulses').children[beat]; if (!d) return;
    d.classList.add('on'); setTimeout(function () { d.classList.remove('on'); }, 110);
  }
  function click(time, kind) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = kind === 'accent' ? 1500 : kind === 'beat' ? 1000 : 700;
    var vol = kind === 'sub' ? 0.18 : 0.4;
    g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    o.start(time); o.stop(time + 0.06);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.12) {
      var beat = Math.floor(tick / sub) % beats, isBeat = tick % sub === 0;
      var kind = isBeat ? (beat === 0 ? 'accent' : 'beat') : 'sub';
      click(nextTime, kind);
      if (isBeat) { (function (b) { setTimeout(function () { if (playing) flash(b); }, Math.max(0, (nextTime - ctx.currentTime) * 1000)); })(beat); }
      nextTime += 60 / bpm / sub; tick++;
    }
    timer = setTimeout(schedule, 25);
  }
  function start() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    playing = true; tick = 0; nextTime = ctx.currentTime + 0.06;
    schedule();
    $('mt-toggle').textContent = 'Stop'; $('mt-toggle').classList.add('running');
  }
  function stop() {
    playing = false; clearTimeout(timer);
    $('mt-toggle').textContent = 'Start'; $('mt-toggle').classList.remove('running');
  }

  $('mt-toggle').onclick = function () { playing ? stop() : start(); };
  $('mt-slider').oninput = function () { setBpm(this.value); };
  $('mt-m10').onclick = function () { setBpm(bpm - 10); };
  $('mt-m1').onclick = function () { setBpm(bpm - 1); };
  $('mt-p1').onclick = function () { setBpm(bpm + 1); };
  $('mt-p10').onclick = function () { setBpm(bpm + 10); };

  $('mt-beats').innerHTML = [2, 3, 4, 5, 6, 7, 9, 12].map(function (n) { return '<button class="iv-chip' + (n === 4 ? ' on' : '') + '" data-b="' + n + '">' + n + '</button>'; }).join('');
  $('mt-beats').onclick = function (e) {
    var b = e.target.closest('.iv-chip'); if (!b) return;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    beats = Number(b.getAttribute('data-b')); tick = 0; drawDots();
  };
  $('mt-sub').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    sub = Number(b.getAttribute('data-sub')); tick = 0;
  };
  $('mt-tap').onclick = function () {
    var now = performance.now();
    taps = taps.filter(function (t) { return now - t < 2000; }); taps.push(now);
    if (taps.length < 2) { $('mt-hint').textContent = 'Tap again…'; return; }
    var gaps = []; for (var i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
    setBpm(60000 / (gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length));
    $('mt-hint').textContent = 'Tempo set from your taps';
  };

  setBpm(100); drawDots();
})();
</script>
