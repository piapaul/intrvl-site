<!--@shared-css-->

<style>
  #cq-streak-count { color: var(--intrvl-accent-dark); }
  #cq-accuracy-count { color: var(--intrvl-active-dark); }
  #intrvl-app .csb-options-grid .choice-btn { font-family: var(--intrvl-font-body); font-size: 1.05rem; line-height: 1.25; min-height: 56px; }
  #cq-target-container {
    background: var(--intrvl-panel-bg);
    border: 2px solid var(--intrvl-border);
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 1.4rem auto;
    padding: 10px 14px;
    box-sizing: border-box;
    box-shadow: inset 0 4px 15px rgba(0,0,0,0.02);
  }
</style>

<canvas aria-hidden="true" id="confetti-canvas-cq" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; opacity:0; transition:opacity 1s ease;"></canvas>

<div id="intrvl-app">

  <div class="intrvl-header-v2">
    <div class="stats-wrapper">
      <div class="stat-box">
        <span class="stat-label">Streak</span>
        <div class="stat-display"><span aria-hidden="true">🔥</span> <span id="cq-streak-count">0</span></div>
      </div>
      <div class="stat-box">
        <span class="stat-label">Accuracy</span>
        <div class="stat-display"><span aria-hidden="true">🎯</span> <span id="cq-accuracy-count">0%</span></div>
      </div>
    </div>
  </div>

  <div id="intrvl-game-area">

    <div id="screen-start" class="button-stack">
      <p id="cq-intro" style="color: var(--intrvl-ink-soft); line-height: 1.5; margin-bottom: 2rem;">
        30 seconds. Name the quality of the chord: major, minor, diminished, augmented, or a 7th.<br>Build your combo for massive points.
      </p>
      <button class="btn-primary" onclick="startCqSprint(true)">Start Daily Sprint</button>
      <button class="btn-practice" onclick="startCqSprint(false)">Practice Sprint</button>
    </div>

    <div id="screen-game" class="hidden" style="width: 100%;">
      <div class="game-hud">
        <div>Score: <span id="ui-score" class="score-highlight">0</span></div>
        <div id="ui-combo" class="combo-badge" aria-hidden="true">🔥 x2 COMBO</div>
        <div><span id="ui-timer" class="timer-highlight">30</span>s</div>
      </div>

      <p class="instruction-text" id="cq-question" aria-live="polite">What type of chord is this?</p>

      <div id="cq-target-container"></div>

      <div class="csb-options-grid" id="cq-buttons-container">
        <button class="choice-btn" id="btn-cq-0" onclick="submitCqGuess(0)">Opt 1</button>
        <button class="choice-btn" id="btn-cq-1" onclick="submitCqGuess(1)">Opt 2</button>
        <button class="choice-btn" id="btn-cq-2" onclick="submitCqGuess(2)">Opt 3</button>
        <button class="choice-btn" id="btn-cq-3" onclick="submitCqGuess(3)">Opt 4</button>
      </div>
    </div>

    <div id="screen-done" class="hidden button-stack">
      <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;" id="end-title">Time's Up!</h2>
      <p style="font-size: 1.4rem; font-family: var(--intrvl-font-head); font-weight: 900; color: var(--intrvl-accent-dark); margin-bottom: 0.5rem;" id="end-score">Score: 0</p>
      <p style="color: var(--intrvl-ink-soft); font-size: 0.9rem; margin-bottom: 2rem;" id="end-high-score">Personal High: 0</p>

      <button class="btn-share hidden" id="btn-share" onclick="shareCqResults()">Share Results 🚀</button>
      <button class="btn-primary hidden" id="btn-try-again" onclick="resetCqToStart()">Back to Menu</button>
    </div>

  </div>

</div>

<script>
  window.INTRVL_CONFIG = {
    startFn: 'startCqSprint',
    kind: 'game', id: 'chordq', gameId: 'chordq',
    easy: false, title: 'Chord Quality',
    accentColors: ['#D9A5B3', '#A9B9A2', '#C1A45F', '#B7A7C9']
  };
</script>
<!--@notation-js-->
<!--@shared-js-->
<script>
  const PAGE_CFG = window.INTRVL_CONFIG;
  const GAME_ID = PAGE_CFG.gameId;                 // 'chordq'
  const EASY = !!PAGE_CFG.easy;
  const TITLE = PAGE_CFG.title;

  // ==== game specific: chords and the questions =================================================
  // A pitch is a stave step (C4 = 28, counting letters upwards) plus a sharp/flat (alter -1, 0, +1).
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const PCS = [0, 2, 4, 5, 7, 9, 11];
  const BASE_STEP = { treble: 30, bass: 18 };            // the bottom line is E4 in treble, G2 in bass
  function semis(p) { return Math.floor(p.step / 7) * 12 + PCS[p.step % 7] + p.alter; }
  function noteName(p) { return LETTERS[p.step % 7] + (p.alter === 1 ? ' sharp' : p.alter === -1 ? ' flat' : ''); }
  function posOf(p, clef) { return p.step - BASE_STEP[clef]; }

  // semitones above the root for each note, stacked in thirds
  const TRIADS = { 'Major': [0, 4, 7], 'Minor': [0, 3, 7], 'Diminished': [0, 3, 6], 'Augmented': [0, 4, 8] };
  const SEVENTHS = { 'Major 7th': [0, 4, 7, 11], 'Dominant 7th': [0, 4, 7, 10], 'Minor 7th': [0, 3, 7, 10], 'Half-diminished 7th': [0, 3, 6, 10] };
  const FAMILIES = [{ name: 'triad', table: TRIADS, weight: 0.6 }, { name: 'seventh', table: SEVENTHS, weight: 0.4 }];
  const POS_MIN = -3, POS_MAX = 11;                      // comfortable reading range (up to 3 ledger lines)

  // Spells a chord upwards from a root; returns null if any note would need a double sharp or flat.
  function spell(rootStep, rootAlter, intervals) {
    const root = { step: rootStep, alter: rootAlter }, rootSemis = semis(root), out = [root];
    for (let k = 1; k < intervals.length; k++) {
      const step = rootStep + 2 * k, natural = semis({ step: step, alter: 0 }), alter = rootSemis + intervals[k] - natural;
      if (Math.abs(alter) > 1) return null;
      out.push({ step: step, alter: alter });
    }
    return out;
  }
  function makeQuestion(rand, wantLabels) {
    for (let attempt = 0; attempt < 400; attempt++) {
      const fam = rand() < FAMILIES[0].weight ? FAMILIES[0] : FAMILIES[1], names = Object.keys(fam.table);
      const pool = (wantLabels && wantLabels.length && rand() < 0.7) ? names.filter(n => wantLabels.indexOf(n) !== -1) : names;
      const quality = (pool.length ? pool : names)[Math.floor(rand() * (pool.length || names.length))];
      const clef = rand() < 0.5 ? 'treble' : 'bass', base = BASE_STEP[clef];
      const topSteps = 2 * (fam.table[quality].length - 1);
      let chord = null;
      for (let r = 0; r < 40 && !chord; r++) {              // some roots can't be spelled without double sharps/flats: try another root, same quality
        const rootPos = POS_MIN + Math.floor(rand() * (POS_MAX - POS_MIN - topSteps + 1));
        chord = spell(base + rootPos, [-1, 0, 0, 0, 1][Math.floor(rand() * 5)], fam.table[quality]);
      }
      if (!chord) continue;
      const options = names.slice();
      for (let j = options.length - 1; j > 0; j--) { const k = Math.floor(rand() * (j + 1)); [options[j], options[k]] = [options[k], options[j]]; }
      const notes = chord.map(p => ({ pos: posOf(p, clef), acc: p.alter === 1 ? 'sharp' : p.alter === -1 ? 'flat' : null }));
      const words = (clef === 'treble' ? 'Treble' : 'Bass') + ' clef: a chord with the notes ' + chord.map(noteName).join(', ') + '.';
      return { clef: clef, notes: notes, correct: quality, options: options, label: quality, words: words, chord: chord, family: fam.name };
    }
    throw new Error('could not make a question');
  }

  function generatePool(useSeed) {
    const rand = useSeed ? IntrvlCore.mulberry32(IntrvlCore.getDailySeed() ^ 0x6a09e667) : () => Math.random();
    const focus = IntrvlCore.takeFocus(GAME_ID);       // topics to lean towards in "practise my weak spots"
    const pool = [];
    for (let i = 0; i < 200; i++) pool.push(makeQuestion(rand, useSeed ? [] : focus));
    return pool;
  }
  function drawQuestion(q) { return IVN.chordSvg({ clef: q.clef, notes: q.notes, label: q.words }); }
  // ==== end game specific =====================================================================

  let pool = [];
  let currentQ = null;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let timerInterval;
  let endTime;
  let isDailyMode = true;
  let isGameActive = false;
  let qIndex = 0;
  let stats;

  function initCqApp() {
    stats = IntrvlCore.loadStats();
    if (!stats.highScoreDaily) stats.highScoreDaily = 0;
    if (!stats.highScorePractice) stats.highScorePractice = 0;
    updateCqUIStats();
    if (stats.lastPlayedDate === IntrvlCore.todayStr()) showCqEndScreen(true, stats.highScoreDaily);
  }

  function updateCqUIStats() {
    document.getElementById('cq-streak-count').textContent = stats.currentStreak;
    const accuracy = stats.totalPlayed > 0 ? Math.round((stats.totalCorrect / stats.totalPlayed) * 100) : 0;
    document.getElementById('cq-accuracy-count').textContent = accuracy + '%';
  }

  function startCqSprint(daily) {
    isDailyMode = daily;
    score = 0;
    combo = 0;
    maxCombo = 0;
    isGameActive = true;

    pool = generatePool(isDailyMode);
    qIndex = 0;

    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');

    updateCqHUD();

    endTime = Date.now() + 30000;
    timerInterval = setInterval(irTick, 100);

    nextCqQuestion();
  }

  function irTick() {
    const remaining = Math.max(0, endTime - Date.now());
    document.getElementById('ui-timer').textContent = Math.ceil(remaining / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      endCqSprint();
    }
  }

  function updateCqHUD() {
    document.getElementById('ui-score').textContent = score;
    const badge = document.getElementById('ui-combo');
    if (combo >= 3) {
      badge.textContent = `🔥 x${1 + Math.floor(combo / 3)} COMBO`;
      badge.classList.add('active');
    } else {
      badge.classList.remove('active');
    }
  }

  function nextCqQuestion() {
    if (!isGameActive) return;
    currentQ = pool[qIndex];
    qIndex++;

    document.getElementById('cq-target-container').innerHTML = drawQuestion(currentQ);

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn-cq-${i}`);
      btn.className = 'choice-btn';
      btn.disabled = false;
      btn.textContent = currentQ.options[i];
    }
    IntrvlCore.refocus('btn-cq-0');
  }

  function submitCqGuess(btnIndex) {
    if (!isGameActive) return;
    for (let i = 0; i < 4; i++) document.getElementById(`btn-cq-${i}`).disabled = true;

    const btn = document.getElementById(`btn-cq-${btnIndex}`);
    const isCorrect = currentQ.options[btnIndex] === currentQ.correct;

    stats.totalPlayed++;
    IntrvlCore.recordItem(GAME_ID, currentQ.label, isCorrect);
    IntrvlCore.announce(isCorrect ? 'Correct' : 'Incorrect. The answer was ' + currentQ.correct);

    if (isCorrect) {
      stats.totalCorrect++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      score += 2 * (1 + Math.floor(combo / 3));
      btn.classList.add('correct');
    } else {
      combo = 0;
      score = Math.max(0, score - 1);
      btn.classList.add('incorrect');
      document.getElementById(`btn-cq-${currentQ.options.indexOf(currentQ.correct)}`).classList.add('correct');
    }

    updateCqHUD();
    setTimeout(nextCqQuestion, 250);
  }

  function endCqSprint() {
    isGameActive = false;
    document.getElementById('screen-game').classList.add('hidden');

    let isNewHigh = false;

    if (isDailyMode) {
      if (stats.lastPlayedDate !== IntrvlCore.todayStr()) {
        stats.currentStreak++;
        stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);
        stats.lastPlayedDate = IntrvlCore.todayStr();
        IntrvlCore.recordDailyResult(score);
      }
      if (score > stats.highScoreDaily) {
        stats.highScoreDaily = score;
        stats.dailyBest = { date: IntrvlCore.dailySeedDate(), score: score };
        isNewHigh = true;
      }
    } else if (score > stats.highScorePractice) {
      stats.highScorePractice = score;
      isNewHigh = true;
    }

    IntrvlCore.saveStats(stats);
    updateCqUIStats();

    if (isNewHigh) IntrvlCore.confetti('confetti-canvas-cq');

    IntrvlCore.announce('Time is up. You scored ' + score + '.');
    showCqEndScreen(isDailyMode, isDailyMode ? stats.highScoreDaily : stats.highScorePractice, isNewHigh);
  }

  function addPracticeButton() {
    if (document.getElementById('cq-temp-prac')) return;
    const pracBtn = document.createElement('button');
    pracBtn.id = 'cq-temp-prac';
    pracBtn.className = 'btn-practice';
    pracBtn.textContent = 'Play Practice Sprint';
    pracBtn.onclick = () => { document.getElementById('cq-temp-prac').remove(); startCqSprint(false); };
    document.getElementById('screen-done').appendChild(pracBtn);
  }

  function showCqEndScreen(wasDaily, high, isNewHigh = false) {
    document.getElementById('screen-done').classList.remove('hidden');

    if (!isGameActive && score === 0 && wasDaily) {         // arrived back on the page after today's daily was done
      document.getElementById('end-title').textContent = 'Daily Complete!';
      document.getElementById('end-score').textContent = `Best Score: ${stats.highScoreDaily}`;
      document.getElementById('end-high-score').style.display = 'none';
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: GAME_ID, score: stats.highScoreDaily, streak: stats.currentStreak });
      addPracticeButton();
      return;
    }

    document.getElementById('end-title').textContent = isNewHigh ? 'New High Score! 🎉' : "Time's Up!";
    document.getElementById('end-score').textContent = `Score: ${score}`;
    document.getElementById('end-high-score').style.display = 'block';
    document.getElementById('end-high-score').textContent = `Personal High: ${high}`;

    if (wasDaily) {
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: GAME_ID, score: score, streak: stats.currentStreak });
      addPracticeButton();
    } else {
      document.getElementById('btn-share').classList.add('hidden');
      document.getElementById('btn-try-again').classList.remove('hidden');
    }
  }

  function resetCqToStart() {
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
    const tempPrac = document.getElementById('cq-temp-prac');
    if (tempPrac) tempPrac.remove();
  }

  function shareCqResults() {
    const accuracy = stats.totalPlayed > 0 ? Math.round((stats.totalCorrect / stats.totalPlayed) * 100) : 0;
    const pageUrl = window.location.href.split('?')[0];
    const textToShare = `I scored ${score} on the Intrvl Daily ${TITLE}! 🧱\n\nMax Combo: 🔥 x${maxCombo}\nStreak: ${stats.currentStreak} Days | Acc: ${accuracy}%\n\nCan you name chords faster than me?\n${pageUrl}`;
    IntrvlCore.share(textToShare, document.getElementById('btn-share'), 'Intrvl ' + TITLE);
  }

  // for automated tests
  window.CQ = { makeQuestion: makeQuestion, generatePool: generatePool, semis: semis, TRIADS: TRIADS, SEVENTHS: SEVENTHS };

  initCqApp();
</script>
