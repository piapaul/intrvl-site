<!--@shared-css-->

<style>
  #notes-streak-count { color: var(--intrvl-accent-dark); }
  #notes-accuracy-count { color: var(--intrvl-active-dark); }
  .combo-badge { position: absolute; top: 50px; right: 10px; left: auto; transform: scale(0); }
  .combo-badge.active { transform: scale(1); }
  .choice-btn { font-size: 1.3rem; font-weight: 800; }

  #note-image-container {
    height: 140px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 2rem;
  }
  #note-image { max-height: 100%; max-width: 100%; object-fit: contain; }
</style>

<canvas aria-hidden="true" id="confetti-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; opacity:0; transition:opacity 1s ease;"></canvas>

<div id="intrvl-app">

  <div class="intrvl-header-v2">
    <div class="stats-wrapper">
      <div class="stat-box">
        <span class="stat-label">Streak</span>
        <div class="stat-display"><span aria-hidden="true">🔥</span> <span id="notes-streak-count">0</span></div>
      </div>
      <div class="stat-box">
        <span class="stat-label">Accuracy</span>
        <div class="stat-display"><span aria-hidden="true">🎯</span> <span id="notes-accuracy-count">0%</span></div>
      </div>
    </div>
  </div>

  <div id="intrvl-game-area">

    <div id="screen-start" class="button-stack">
      <p style="color: var(--intrvl-ink-soft); line-height: 1.5; margin-bottom: 2rem;">
        30 seconds. Lightning fast.<br>Build your combo for massive points.
      </p>
      <button class="btn-primary" onclick="startGame(true)">Start Daily Sprint (All Notes)</button>
      <button class="btn-practice" onclick="startGame(false)">Practice Sprint (Naturals Only)</button>
    </div>

    <div id="screen-game" class="hidden" style="width: 100%;">
      <div class="game-hud">
        <div>Score: <span id="ui-score" class="score-highlight">0</span></div>
        <div><span id="ui-timer" class="timer-highlight">30</span>s</div>
      </div>

      <div id="ui-combo" class="combo-badge" aria-hidden="true">🔥 x2 COMBO</div>

      <div id="note-image-container">
        <img id="note-image" src="" alt="Note on stave" style="display:none;"/>
      </div>

      <div class="choice-controls">
        <button class="choice-btn" id="btn-0" onclick="submitGuess(0)">A</button>
        <button class="choice-btn" id="btn-1" onclick="submitGuess(1)">B</button>
        <button class="choice-btn" id="btn-2" onclick="submitGuess(2)">C</button>
      </div>
    </div>

    <div id="screen-done" class="hidden button-stack">
      <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;" id="end-title">Time's Up!</h2>
      <p style="font-size: 1.4rem; font-family: var(--intrvl-font-head); font-weight: 900; color: var(--intrvl-accent-dark); margin-bottom: 0.5rem;" id="end-score">Score: 0</p>
      <p style="color: var(--intrvl-ink-soft); font-size: 0.9rem; margin-bottom: 2rem;" id="end-high-score">Personal High: 0</p>

      <button class="btn-share hidden" id="btn-share" onclick="shareResults()">Share Results 🚀</button>
      <button class="btn-primary hidden" id="btn-try-again" onclick="resetToStart()">Back to Menu</button>
    </div>

  </div>

</div>

<script>
  window.INTRVL_CONFIG = {
    startFn: 'startGame',
    kind: 'game', id: 'note', gameId: 'note',
    legacyStatsKeys: ['intrvlNoteStatsV2'],
    accentColors: ['#bfae94', '#A9B9A2', '#bda569', '#a3b0bd']
  };
</script>
<!--@shared-js-->
<script>
  const DATA_URL = "https://piapaul.github.io/music-theory-images/standard-notes.json";
  const IMAGE_BASE_URL = "https://piapaul.github.io/music-theory-images/single";

  let allNotesData = [];
  let focusNotes = [];
  let currentPool = [];
  let currentQuestion = null;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let timerInterval;
  let endTime;
  let isDailyMode = true;
  let isGameActive = false;
  let stats;

  async function initApp() {
    try {
      allNotesData = await fetch(DATA_URL).then(r => r.json());
      IV.prefetch(Array.from(new Set(allNotesData.map(q => `${IMAGE_BASE_URL}/${q.clef}/${getFilename(q)}`))));   // installed app: keep the pictures for offline play
      stats = IntrvlCore.loadStats();
      if (!stats.highScoreDaily) stats.highScoreDaily = 0;
      if (!stats.highScorePractice) stats.highScorePractice = 0;
      updateUIStats();

      if (stats.lastPlayedDate === IntrvlCore.todayStr()) {
        showEndScreen(true, stats.highScoreDaily);
      }
    } catch (e) {
      document.getElementById('screen-start').innerHTML = "<p>Failed to load notes. Please refresh.</p>";
    }
  }

  function updateUIStats() {
    document.getElementById('notes-streak-count').textContent = stats.currentStreak;
    let accuracy = stats.totalPlayed > 0 ? Math.round((stats.totalCorrect / stats.totalPlayed) * 100) : 0;
    document.getElementById('notes-accuracy-count').textContent = accuracy + "%";
  }

  function isNaturalNote(noteObj, filename) {
    if (noteObj.accidental === "sharp" || noteObj.accidental === "flat") return false;
    if (filename.includes("-sharp-") || filename.includes("-flat-")) return false;
    return true;
  }

  // Describes where the note sits, for screen readers (best effort: needs the file name to follow single-<note><octave>-...).
  const CLEF_BOTTOM_LINE = { treble: 'E4', bass: 'G2', alto: 'F3', tenor: 'D3' };
  const POSITION_WORDS = ['on the bottom line', 'in the bottom space', 'on the second line', 'in the second space', 'on the middle line', 'in the third space', 'on the fourth line', 'in the top space', 'on the top line'];
  function stepOf(name) { const m = /^([A-G])(\d)$/.exec(name); return m ? Number(m[2]) * 7 + 'CDEFGAB'.indexOf(m[1]) : null; }
  function noteAlt(q, filename) {
    const clef = String(q.clef || '').toLowerCase();
    const m = /single-([A-G]\d)/.exec(filename || '');
    const pos = (m && CLEF_BOTTOM_LINE[clef]) ? stepOf(m[1]) - stepOf(CLEF_BOTTOM_LINE[clef]) : null;
    const ORD = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth'];
    let where = 'on the stave';
    if (pos !== null) {
      if (pos >= 0 && pos <= 8) where = POSITION_WORDS[pos];
      else if (pos === -1) where = 'just below the bottom line';
      else if (pos < -1) where = pos % 2 === 0 ? 'on the ' + ORD[-pos / 2] + ' ledger line below the stave' : 'in the space below the ' + ORD[(-pos - 1) / 2] + ' ledger line';
      else if (pos === 9) where = 'just above the top line';
      else where = pos % 2 === 0 ? 'on the ' + ORD[(pos - 8) / 2] + ' ledger line above the stave' : 'in the space above the ' + ORD[(pos - 9) / 2] + ' ledger line';
    }
    const acc = q.accidental && q.accidental !== 'natural' ? ', with a ' + q.accidental + ' sign' : '';
    return 'A note ' + where + ' in the ' + (clef || 'treble') + ' clef' + acc;
  }
  function getFilename(noteObj) { return (noteObj.fileurl || "").split("/").pop(); }

  function startGame(daily) {
    isDailyMode = daily;
    score = 0;
    combo = 0;
    maxCombo = 0;
    isGameActive = true;

    const focusLabels = IntrvlCore.takeFocus('note');   // topics to lean towards in "practise my weak spots"
    focusNotes = isDailyMode ? [] : focusLabels;
    if (isDailyMode) {
      currentPool = allNotesData;
    } else {
      currentPool = allNotesData.filter(d => isNaturalNote(d, getFilename(d)));
    }

    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');

    updateHUD();
    document.getElementById('note-image').style.display = 'block';

    endTime = Date.now() + 30000;
    timerInterval = setInterval(tick, 100);

    nextQuestion();
  }

  function tick() {
    const remaining = Math.max(0, endTime - Date.now());
    document.getElementById('ui-timer').textContent = Math.ceil(remaining / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }

  function updateHUD() {
    document.getElementById('ui-score').textContent = score;
    const badge = document.getElementById('ui-combo');
    if (combo >= 3) {
      const mult = 1 + Math.floor(combo / 3);
      badge.textContent = `🔥 x${mult} COMBO`;
      badge.classList.add('active');
    } else {
      badge.classList.remove('active');
    }
  }

  function nextQuestion() {
    if (!isGameActive) return;

    for (let i = 0; i < 3; i++) {
      const btn = document.getElementById(`btn-${i}`);
      btn.className = 'choice-btn';
      btn.disabled = false;
    }

    let q = currentPool[Math.floor(Math.random() * currentPool.length)];
    if (focusNotes.length && Math.random() < 0.7) {
      const weak = allNotesData.filter(d => focusNotes.indexOf(d['note-name']) !== -1);
      if (weak.length) q = weak[Math.floor(Math.random() * weak.length)];
    }
    const correct = q['note-name'];
    const filename = getFilename(q);
    const accidentalGroup = isNaturalNote(q, filename) ? "natural" : (q.accidental || "");

    const wrongPool = allNotesData.filter(d => {
      const dFilename = getFilename(d);
      const dGroup = isNaturalNote(d, dFilename) ? "natural" : (d.accidental || "");
      return d['note-name'] !== correct && dGroup === accidentalGroup;
    });

    let w1 = wrongPool[Math.floor(Math.random() * wrongPool.length)];
    let w2;
    do { w2 = wrongPool[Math.floor(Math.random() * wrongPool.length)]; }
    while (w2['note-name'] === w1['note-name'] || w2['note-name'] === correct);

    const options = [correct, w1['note-name'], w2['note-name']].sort(() => Math.random() - 0.5);

    document.getElementById('note-image').src = `${IMAGE_BASE_URL}/${q.clef}/${filename}`;

    currentQuestion = { correct: correct, options: options };
    document.getElementById('note-image').alt = noteAlt(q, filename);

    for (let i = 0; i < 3; i++) {
      const btn = document.getElementById(`btn-${i}`);
      btn.textContent = options[i];
    }
    IntrvlCore.refocus('btn-0');
  }

  function submitGuess(btnIndex) {
    if (!isGameActive) return;
    for (let i = 0; i < 3; i++) document.getElementById(`btn-${i}`).disabled = true;

    const btn = document.getElementById(`btn-${btnIndex}`);
    const isCorrect = currentQuestion.options[btnIndex] === currentQuestion.correct;

    stats.totalPlayed++;
    IntrvlCore.recordItem('note', currentQuestion.correct, isCorrect);
    IntrvlCore.announce(isCorrect ? 'Correct' : 'Incorrect. The answer was ' + currentQuestion.correct);

    if (isCorrect) {
      stats.totalCorrect++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const multiplier = 1 + Math.floor(combo / 3);
      score += (2 * multiplier);
      btn.classList.add('correct');
    } else {
      combo = 0;
      score = Math.max(0, score - 1);
      btn.classList.add('incorrect');
    }

    updateHUD();
    setTimeout(nextQuestion, 150);
  }

  function endGame() {
    isGameActive = false;
    document.getElementById('screen-game').classList.add('hidden');

    let isNewHigh = false;

    if (isDailyMode) {
      if (stats.lastPlayedDate !== IntrvlCore.todayStr()) {
        stats.currentStreak++;
        stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);
        stats.lastPlayedDate = IntrvlCore.todayStr();
        IntrvlCore.recordDailyResult(score);
      }
      if (score > stats.highScoreDaily) {
        stats.highScoreDaily = score;
        stats.dailyBest = { date: IntrvlCore.dailySeedDate(), score: score };
        isNewHigh = true;
      }
    } else {
      if (score > stats.highScorePractice) {
        stats.highScorePractice = score;
        isNewHigh = true;
      }
    }

    IntrvlCore.saveStats(stats);
    updateUIStats();

    if (isNewHigh) IntrvlCore.confetti('confetti-canvas');

    IntrvlCore.announce('Time is up. You scored ' + score + '.');
    showEndScreen(isDailyMode, isDailyMode ? stats.highScoreDaily : stats.highScorePractice, isNewHigh);
  }

  function showEndScreen(wasDaily, high, isNewHigh = false) {
    document.getElementById('screen-done').classList.remove('hidden');

    if (!isGameActive && score === 0 && wasDaily) {
      document.getElementById('end-title').textContent = "Daily Complete!";
      document.getElementById('end-score').textContent = `Best Score: ${stats.highScoreDaily}`;
      document.getElementById('end-high-score').style.display = 'none';
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: 'note', score: stats.highScoreDaily, streak: stats.currentStreak });

      if (!document.getElementById('temp-prac')) {
        const pracBtn = document.createElement('button');
        pracBtn.id = 'temp-prac';
        pracBtn.className = 'btn-practice';
        pracBtn.textContent = 'Play Practice Sprint';
        pracBtn.onclick = () => { document.getElementById('temp-prac').remove(); startGame(false); };
        document.getElementById('screen-done').appendChild(pracBtn);
      }
      return;
    }

    document.getElementById('end-title').textContent = isNewHigh ? "New High Score! 🎉" : "Time's Up!";
    document.getElementById('end-score').textContent = `Score: ${score}`;
    document.getElementById('end-high-score').style.display = 'block';
    document.getElementById('end-high-score').textContent = `Personal High: ${high}`;

    if (wasDaily) {
      document.getElementById('btn-share').classList.remove('hidden');
      document.getElementById('btn-try-again').classList.add('hidden');
      IntrvlLeaderboard.attachSubmitButton({ gameId: 'note', score: score, streak: stats.currentStreak });

      if (!document.getElementById('temp-prac')) {
        const pracBtn = document.createElement('button');
        pracBtn.id = 'temp-prac';
        pracBtn.className = 'btn-practice';
        pracBtn.textContent = 'Play Practice Sprint';
        pracBtn.onclick = () => { document.getElementById('temp-prac').remove(); startGame(false); };
        document.getElementById('screen-done').appendChild(pracBtn);
      }
    } else {
      document.getElementById('btn-share').classList.add('hidden');
      document.getElementById('btn-try-again').classList.remove('hidden');
    }
  }

  function resetToStart() {
    document.getElementById('screen-done').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
  }

  function shareResults() {
    let accuracy = stats.totalPlayed > 0 ? Math.round((stats.totalCorrect / stats.totalPlayed) * 100) : 0;
    const pageUrl = window.location.href.split('?')[0];
    const textToShare = `I scored ${score} on the Intrvl Daily Note Sprint! 🎵\n\nMax Combo: 🔥 x${maxCombo}\nStreak: ${stats.currentStreak} Days | Acc: ${accuracy}%\n\nCan you read music faster than me?\n${pageUrl}`;
    IntrvlCore.share(textToShare, document.getElementById('btn-share'), 'Intrvl Note Sprint');
  }

  initApp();
</script>
