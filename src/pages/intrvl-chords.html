<style>
  .ck-list { display: flex; flex-direction: column; gap: .5rem; }

  .ck-sym { font: 900 1.05rem var(--intrvl-font-head); }
  .ck-notes { font-size: .85rem; color: var(--intrvl-ink); margin-top: 2px; font-weight: 600; }
  .ck-fn { font-size: .74rem; color: var(--intrvl-ink-soft); margin-top: 1px; }

  <div class="iv-label">Scale</div>
  <div class="iv-seg" id="ck-type">
    <button data-t="major" class="on">Major</button>
    <button data-t="natural">Minor</button>
    <button data-t="harmonic">Harmonic minor</button>
  </div>

  <div class="iv-label" style="margin-top:.9rem">Key</div>
  <select class="iv-select" id="ck-key" aria-label="Key"></select>

  <div class="iv-label" style="margin-top:.9rem">Chord size</div>
  <div class="iv-chips" id="ck-size"></div>

  <div class="iv-row between" style="margin-top:1.2rem">
    <h2 class="iv-h2" style="margin:0" id="ck-title"></h2>
    <button class="iv-btn small ghost" id="ck-playall">▶ Play all</button>
  </div>
  <p class="iv-note" style="margin:.2rem 0 .7rem">Tap a chord to see how to play it on the piano — every inversion.</p>
  <div class="ck-list" id="ck-list"></div>
</div>

  function refresh() { drawControls(); drawList(); }

  // ---------- chord sheet ----------
  function openChord(i) {
    var size = st.size;
    var s = IV.openSheet('<div id="ckc"></div>', null, null);
    var host = s.querySelector('#ckc'), base = Math.min(size, 4);   // inversions are drawn for the triad / 7th

    function render(base) {
      var c = chord(i, size), cb = chord(i, base);
      var names = cb.tones.map(T.name), root = stackMidis(cb.tones);
      var invs = [];
      for (var j = 0; j < base; j++) invs.push(inversion(root, j));
      var lo = Math.min.apply(null, invs.map(function (a) { return Math.min.apply(null, a); })), hi = Math.max.apply(null, invs.map(function (a) { return Math.max.apply(null, a); }));
      var win = [whiteDown(lo), whiteUp(hi)];
      var labels = ['Root position', '1st inversion', '2nd inversion', '3rd inversion'];

      var html = '<h3>' + esc(cb.num) + ' · ' + esc(cb.sym) + '</h3><p class="iv-note" style="margin:-.5rem 0 .8rem">' + keyName() + ' · ' + c.fn + '</p>';
      if (size > 4) html += '<div class="iv-seg" id="ckc-base" style="margin-bottom:1rem"><button data-b="3"' + (base === 3 ? ' class="on"' : '') + '>Triad inversions</button><button data-b="4"' + (base === 4 ? ' class="on"' : '') + '>7th inversions</button></div>';
      else if (size === 4 || size === 3) html += '<div class="iv-seg" id="ckc-base" style="margin-bottom:1rem"><button data-b="3"' + (base === 3 ? ' class="on"' : '') + '>Triad</button><button data-b="4"' + (base === 4 ? ' class="on"' : '') + '>7th chord</button></div>';

      invs.forEach(function (m, j) {
        var order = inversionNames(names, j);
        html += '<div class="ck-inv"><div class="ck-inv-head"><div><b>' + labels[j] + '</b><div class="iv-note">' + order[0] + ' in the bass · ' + order.join(' – ') + '</div></div>' +
          '<div class="iv-row"><button class="iv-iconbtn" data-play="' + j + '" aria-label="Play chord">▶</button><button class="iv-iconbtn" data-arp="' + j + '" aria-label="Play as arpeggio">♫</button></div></div>' +
          pianoFor(cb, m, order, win) + '</div>';
      });

      if (size > 4) {
        var full = stackMidis(c.all.slice(0, size)), fnames = c.all.slice(0, size).map(T.name);
        html += '<div class="ck-inv"><div class="ck-inv-head"><div><b>Extended chord · ' + esc(c.sym) + '</b><div class="iv-note">Root position, ' + fnames.join(' – ') + (c.rubs.length ? ' · ⚠ ' + c.rubs.join(', ') + ' clashes (a semitone above a chord tone)' : '') + '</div></div>' +
          '<div class="iv-row"><button class="iv-iconbtn" data-playx="1" aria-label="Play chord">▶</button><button class="iv-iconbtn" data-arpx="1" aria-label="Play as arpeggio">♫</button></div></div>' +
          pianoFor(c, full, fnames, [whiteDown(full[0]), whiteUp(full[full.length - 1])]) + '</div>';
      }
      host.innerHTML = html;

      host.onclick = function (e) {
        var p = e.target.closest('[data-play]'), a = e.target.closest('[data-arp]'), px = e.target.closest('[data-playx]'), ax = e.target.closest('[data-arpx]'), b = e.target.closest('#ckc-base button');
        if (p) T.play(invs[Number(p.getAttribute('data-play'))], { dur: 1.8 });
        else if (a) T.play(invs[Number(a.getAttribute('data-arp'))], { gap: 0.28, dur: 1.4 });
        else if (px && size > 4) T.play(stackMidis(c.all.slice(0, size)), { dur: 2.2 });
        else if (ax && size > 4) T.play(stackMidis(c.all.slice(0, size)), { gap: 0.28, dur: 1.4 });
        else if (b) render(Number(b.getAttribute('data-b')));
      };
    }
    render(base);
  }
  function inversionNames(names, j) { return names.slice(j).concat(names.slice(0, j)); }

  $('ck-type').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.type = b.getAttribute('data-t');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    refresh();
  };
  $('ck-key').onchange = function () { st.s = Number(this.value); drawList(); };
  $('ck-size').onclick = function (e) { var b = e.target.closest('.iv-chip'); if (b) { st.size = Number(b.getAttribute('data-n')); refresh(); } };
  $('ck-list').onclick = function (e) { var c = e.target.closest('.ck-card'); if (c) openChord(Number(c.getAttribute('data-i'))); };
  $('ck-playall').onclick = function () {
    var t = 0;
    for (var i = 0; i < 7; i++) (function (i) { setTimeout(function () { T.play(stackMidis(chord(i, Math.min(st.size, 4)).tones), { dur: 1.1 }); }, t); t += 800; })(i);
  };
  refresh();
})();
</script>
